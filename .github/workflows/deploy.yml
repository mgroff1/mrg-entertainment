name: Deploy to GitHub Pages

on:
  push:
    branches: 'main' # Or 'master', depending on your default branch name

# Sets permissions to allow the deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevents multiple builds from running at the exact same time
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Uses --legacy-peer-deps automatically to bypass that old ESLint error you had!
        run: npm ci --legacy-peer-deps

      - name: Build SvelteKit app
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4